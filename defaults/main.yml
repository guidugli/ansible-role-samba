---
# defaults file for samba

# Name of a file under files/ to deploy as smb.conf. Set to an empty string to skip configuration deployment.
smb_file: ""

# Samba users to add or update. Linux accounts must already exist on the target host.
smb_users: []

# Samba users to remove from the Samba password database.
smb_users_remove: []

# SELinux Samba boolean controls.
smb_samba_export_all_ro: false
smb_samba_export_all_rw: false
smb_allow_smbd_anon_write: false
smb_enable_home_dirs: false
smb_create_home_dirs: false
smb_domain_controller: false
smb_share_fusefs: false
smb_virt_use_samba: false
smb_share_nfs: false
smb_run_unconfined: false
smb_portmapper: false
smb_use_samba_home_dirs: false
smb_sanlock_use_samba: false
