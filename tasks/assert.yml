---
- name: Check smb_file value
  ansible.builtin.assert:
    that:
      - smb_file is string
    quiet: true
  tags:
    - samba
    - validate

- name: Check smb_users list
  ansible.builtin.assert:
    that:
      - smb_users is iterable
      - smb_users is not string
    quiet: true
  tags:
    - samba
    - validate

- name: Check smb_users items values
  ansible.builtin.assert:
    that:
      - item.name is string
      - item.name | length > 0
      - item.password is string
      - item.password | length > 0
    quiet: true
  loop: "{{ smb_users }}"
  loop_control:
    label: "{{ item.name | default('undefined') }}"
  no_log: true
  tags:
    - samba
    - validate

- name: Check smb_users_remove list
  ansible.builtin.assert:
    that:
      - smb_users_remove is iterable
      - smb_users_remove is not string
    quiet: true
  tags:
    - samba
    - validate

- name: Check smb_users_remove items values
  ansible.builtin.assert:
    that:
      - item is string
      - item | length > 0
    quiet: true
  loop: "{{ smb_users_remove }}"
  tags:
    - samba
    - validate

- name: Check SELinux boolean values
  ansible.builtin.assert:
    that:
      - vars[item] | type_debug == 'bool'
    quiet: true
  loop:
    - smb_samba_export_all_ro
    - smb_samba_export_all_rw
    - smb_allow_smbd_anon_write
    - smb_enable_home_dirs
    - smb_create_home_dirs
    - smb_domain_controller
    - smb_share_fusefs
    - smb_virt_use_samba
    - smb_share_nfs
    - smb_run_unconfined
    - smb_portmapper
    - smb_use_samba_home_dirs
    - smb_sanlock_use_samba
  tags:
    - samba
    - validate
