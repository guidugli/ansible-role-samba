---
- name: Ensure Samba packages are installed
  ansible.builtin.package:
    name: "{{ smb_packages }}"
    state: present
    update_cache: true
  tags:
    - samba
    - install

- name: Enable Samba services when systemd is available
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: true
  loop: "{{ smb_service_names }}"
  when: ansible_facts['service_mgr'] == 'systemd'
  tags:
    - samba
    - service

- name: Copy Samba configuration file to destination
  ansible.builtin.copy:
    src: "{{ smb_file }}"
    dest: "{{ smb_conf_dir }}/{{ smb_conf_file }}"
    owner: "{{ smb_owner }}"
    group: "{{ smb_group }}"
    mode: "{{ smb_mode }}"
    backup: true
    force: true
    validate: testparm -s %s
  when: smb_file | length > 0
  notify: Restart Samba
  tags:
    - samba
    - config

- name: Set SELinux Samba boolean values
  ansible.posix.seboolean:
    name: "{{ smb_sebool_map[item] }}"
    state: "{{ vars[item] }}"
    persistent: true
  when:
    - vars[item] is defined
    - ansible_facts['selinux']['status'] is defined
    - ansible_facts['selinux']['status'] == 'enabled'
  loop:
    - smb_samba_export_all_ro
    - smb_samba_export_all_rw
    - smb_allow_smbd_anon_write
    - smb_enable_home_dirs
    - smb_create_home_dirs
    - smb_domain_controller
    - smb_share_fusefs
    - smb_virt_use_samba
    - smb_share_nfs
    - smb_run_unconfined
    - smb_portmapper
    - smb_use_samba_home_dirs
    - smb_sanlock_use_samba
  notify: Restart Samba
  tags:
    - samba
    - config

- name: Add or update Samba users
  ansible.builtin.include_tasks: smbadduser.yml
  loop: "{{ smb_users }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  tags:
    - samba
    - config

- name: Delete Samba users when present
  ansible.builtin.command:
    argv:
      - smbpasswd
      - -x
      - "{{ item }}"
  register: smb_remove_result
  changed_when: smb_remove_result.rc == 0
  failed_when:
    - smb_remove_result.rc != 0
    - smb_remove_result.stdout is not search('Failed to find entry for user')
    - smb_remove_result.stderr is not search('Failed to find entry for user')
  loop: "{{ smb_users_remove }}"
  tags:
    - samba
    - config
